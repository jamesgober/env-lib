[package]
name = "env-lib"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
readme = "README.md"
license = "Apache-2.0 OR MIT"
authors = ["James Gober <me@jamesgober.com>"]
description = "Application environment variables for Rust: set, read, and remove variables in code, persist them to a .env file that survives manual edits, and export them under a namespace prefix. Zero third-party dependencies."
keywords = ["env", "dotenv", "environment", "config", "variables"]
categories = ["config", "os"]
documentation = "https://docs.rs/env-lib"
repository = "https://github.com/jamesgober/env-lib"
homepage = "https://github.com/jamesgober/env-lib"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "env_lib"
path = "src/lib.rs"

[dependencies]
# Atomic file replacement, home expansion, and application directories.
# First-party crate (same author, same standards), zero dependencies of
# its own.
path-lib = "1.0"

[dev-dependencies]
# Benchmarks (REPS: criterion for every performance-sensitive path).
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# Property tests for the .env parser and writer round trip.
proptest = { version = "1", default-features = false, features = ["std"] }

[[bench]]
name = "env_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
